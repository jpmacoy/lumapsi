<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LumaPsi — Perfil do Psicólogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}

:root {
  --roxo: #3730A3;
  --roxo-cl: #EEF2FF;
  --roxo-med: #818CF8;
  --verde: #059669;
  --verde-cl: #ECFDF5;
  --cinza: #6B7280;
  --cinza-cl: #F9FAFB;
  --preto: #111827;
  --borda: #E5E7EB;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: #FAFAFA;
  color: var(--preto);
  min-height: 100vh;
}

/* ── HERO ─────────────────────────── */
.hero {
  background: linear-gradient(135deg, #1E1B4B 0%, #3730A3 60%, #4F46E5 100%);
  padding: 60px 24px 80px;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  top: -80px; right: -80px;
  width: 400px; height: 400px;
  border-radius: 50%;
  background: rgba(129,140,248,0.15);
}
.hero::after {
  content: '';
  position: absolute;
  bottom: -100px; left: -60px;
  width: 300px; height: 300px;
  border-radius: 50%;
  background: rgba(129,140,248,0.10);
}
.hero-inner {
  max-width: 680px;
  margin: 0 auto;
  display: flex;
  gap: 40px;
  align-items: center;
  position: relative;
  z-index: 1;
}
.hero-foto {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid rgba(255,255,255,0.3);
  flex-shrink: 0;
  background: rgba(255,255,255,0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
  color: rgba(255,255,255,0.6);
}
.hero-foto img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
}
.hero-info { flex: 1; }
.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.25);
  color: rgba(255,255,255,0.9);
  font-size: 12px;
  padding: 4px 12px;
  border-radius: 20px;
  margin-bottom: 12px;
}
.hero-nome {
  font-family: 'Playfair Display', serif;
  font-size: 36px;
  color: #fff;
  line-height: 1.15;
  margin-bottom: 6px;
}
.hero-crp {
  font-size: 13px;
  color: rgba(255,255,255,0.6);
  margin-bottom: 16px;
}
.hero-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 24px;
}
.hero-tag {
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.2);
  color: #fff;
  font-size: 12px;
  padding: 4px 12px;
  border-radius: 20px;
}
.hero-btns {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.btn-agendar {
  background: #fff;
  color: var(--roxo);
  border: none;
  padding: 12px 28px;
  border-radius: 50px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: transform .15s, box-shadow .15s;
}
.btn-agendar:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
.btn-wpp {
  background: #25D366;
  color: #fff;
  border: none;
  padding: 12px 24px;
  border-radius: 50px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: transform .15s;
}
.btn-wpp:hover { transform: translateY(-2px); }

/* ── INFOS RÁPIDAS ─────────────────── */
.info-strip {
  background: #fff;
  border-bottom: 1px solid var(--borda);
  padding: 16px 24px;
}
.info-strip-inner {
  max-width: 680px;
  margin: 0 auto;
  display: flex;
  gap: 32px;
  flex-wrap: wrap;
}
.info-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--cinza);
}
.info-item i { color: var(--roxo); font-size: 16px; }
.info-item strong { color: var(--preto); }

/* ── CONTEÚDO ─────────────────────── */
.content {
  max-width: 680px;
  margin: 0 auto;
  padding: 40px 24px;
}
.section {
  margin-bottom: 48px;
}
.section-label {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .8px;
  text-transform: uppercase;
  color: var(--roxo);
  margin-bottom: 12px;
}
.section-title {
  font-family: 'Playfair Display', serif;
  font-size: 26px;
  color: var(--preto);
  margin-bottom: 16px;
  line-height: 1.3;
}
.section-text {
  font-size: 15px;
  line-height: 1.8;
  color: var(--cinza);
}

/* ── ABORDAGEM ─────────────────────── */
.abordagem-card {
  background: var(--roxo-cl);
  border-radius: 16px;
  padding: 24px;
  border-left: 4px solid var(--roxo);
}
.abordagem-card p {
  font-size: 15px;
  line-height: 1.8;
  color: #3730A3;
}

/* ── ESPECIALIDADES ────────────────── */
.esp-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.esp-item {
  background: #fff;
  border: 1px solid var(--borda);
  border-radius: 12px;
  padding: 10px 16px;
  font-size: 13px;
  color: var(--preto);
  display: flex;
  align-items: center;
  gap: 8px;
}
.esp-item i { color: var(--roxo); font-size: 15px; }

/* ── MODALIDADES ─────────────────── */
.modal-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.modal-card {
  background: #fff;
  border: 1px solid var(--borda);
  border-radius: 16px;
  padding: 20px;
}
.modal-card.destaque { border-color: var(--roxo-med); }
.modal-icon {
  width: 44px; height: 44px;
  border-radius: 12px;
  background: var(--roxo-cl);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 12px;
}
.modal-icon i { color: var(--roxo); font-size: 20px; }
.modal-title { font-size: 15px; font-weight: 500; margin-bottom: 4px; }
.modal-sub { font-size: 13px; color: var(--cinza); }

/* ── CTA FINAL ───────────────────── */
.cta-box {
  background: linear-gradient(135deg, #1E1B4B 0%, #3730A3 100%);
  border-radius: 20px;
  padding: 40px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.cta-box::before {
  content: '';
  position: absolute;
  top: -40px; right: -40px;
  width: 200px; height: 200px;
  border-radius: 50%;
  background: rgba(129,140,248,0.15);
}
.cta-box h2 {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  color: #fff;
  margin-bottom: 8px;
  position: relative;
}
.cta-box p {
  font-size: 14px;
  color: rgba(255,255,255,0.7);
  margin-bottom: 24px;
  position: relative;
}
.cta-btns {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  position: relative;
}

/* ── FORM AGENDAMENTO ─────────────── */
.form-section {
  background: #fff;
  border-radius: 20px;
  border: 1px solid var(--borda);
  padding: 32px;
  margin-bottom: 48px;
}
.form-title {
  font-family: 'Playfair Display', serif;
  font-size: 22px;
  margin-bottom: 4px;
}
.form-sub { font-size: 13px; color: var(--cinza); margin-bottom: 24px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group label { font-size: 12px; font-weight: 500; color: var(--cinza); }
.form-input {
  border: 1px solid var(--borda);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  outline: none;
  transition: border-color .15s;
  width: 100%;
}
.form-input:focus { border-color: var(--roxo-med); }
textarea.form-input { resize: vertical; min-height: 80px; }
.btn-submit {
  background: var(--roxo);
  color: #fff;
  border: none;
  border-radius: 50px;
  padding: 14px 32px;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  width: 100%;
  margin-top: 8px;
  font-family: 'DM Sans', sans-serif;
  transition: background .15s, transform .15s;
}
.btn-submit:hover { background: #4F46E5; transform: translateY(-1px); }
.btn-submit:disabled { background: var(--cinza); cursor: not-allowed; transform: none; }

/* ── FOOTER ──────────────────────── */
.footer {
  background: #fff;
  border-top: 1px solid var(--borda);
  padding: 24px;
  text-align: center;
}
.footer a {
  color: var(--roxo);
  text-decoration: none;
  font-size: 13px;
}
.footer p { font-size: 12px; color: var(--cinza); margin-top: 4px; }

/* ── TOAST ───────────────────────── */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--preto);
  color: #fff;
  padding: 12px 24px;
  border-radius: 50px;
  font-size: 14px;
  z-index: 1000;
  transition: transform .3s;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.ok { background: var(--verde); }
.toast.err { background: #DC2626; }

/* ── LOADING ─────────────────────── */
.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-size: 14px;
  color: var(--cinza);
  gap: 12px;
}
.spinner {
  width: 24px; height: 24px;
  border: 2px solid var(--borda);
  border-top-color: var(--roxo);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── NOT FOUND ───────────────────── */
.not-found {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 60vh;
  text-align: center;
  padding: 40px 24px;
}
.not-found h1 { font-family: 'Playfair Display', serif; font-size: 32px; margin-bottom: 8px; }
.not-found p { color: var(--cinza); margin-bottom: 24px; }

/* ── MOBILE ──────────────────────── */
@media (max-width: 640px) {
  .hero-inner { flex-direction: column; align-items: flex-start; gap: 20px; }
  .hero-foto { width: 100px; height: 100px; font-size: 36px; }
  .hero-nome { font-size: 28px; }
  .modal-grid { grid-template-columns: 1fr; }
  .form-row { grid-template-columns: 1fr; }
  .cta-box { padding: 28px 20px; }
}
</style>
</head>
<body>

<div id="root">
  <div class="loading">
    <div class="spinner"></div>
    Carregando perfil...
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPA_URL = 'https://pbqvfokpounurzmmlcor.supabase.co';
const SUPA_KEY = 'sb_publishable_ERIUNIAjp2FJyXNF6IS_dw_RNopwplO';
const { createClient } = supabase;
const sb = createClient(SUPA_URL, SUPA_KEY);

// Pegar o slug da URL: /agendar/joao-pedro
function getSlug() {
  const path = window.location.pathname;
  const parts = path.split('/').filter(Boolean);
  if (parts[0] === 'perfil' && parts[1]) return parts[1];
  if (parts[0] === 'agendar' && parts[1]) return parts[1];
  if (parts.length === 1) return parts[0];
  return null;
}

function toast(msg, tipo) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (tipo === 'ok' ? 'ok' : tipo === 'err' ? 'err' : '');
  setTimeout(() => t.className = 'toast', 3000);
}

const ESPECIALIDADES_ICONS = {
  'Ansiedade': 'brain',
  'Depressão': 'mood-sad',
  'Relacionamentos': 'heart',
  'Autoconhecimento': 'user-search',
  'Família': 'users',
  'Trabalho e carreira': 'briefcase',
  'Luto': 'flower',
  'Trauma': 'shield',
  'Transtornos alimentares': 'apple',
  'Saúde mental': 'heartbeat',
  'Adolescentes': 'school',
  'Infantil': 'baby-carriage',
  'LGBTQIA+': 'rainbow',
  'Fobia': 'eye-off',
  'TOC': 'refresh',
  'Burnout': 'battery-off',
  'Autoestima': 'star',
  'Vícios': 'hand-stop',
};

async function carregarPerfil() {
  const slug = getSlug();
  if (!slug) { mostrarNotFound('Perfil não encontrado.'); return; }

  const { data: cfg, error } = await sb
    .from('configuracoes')
    .select('*')
    .eq('slug', slug)
    .single();

  if (error || !cfg) { mostrarNotFound('Este perfil não existe ou foi removido.'); return; }

  renderPerfil(cfg);
}

function renderPerfil(cfg) {
  const nome = cfg.nome || 'Psicólogo(a)';
  const crp = cfg.crp ? `CRP ${cfg.crp}` : '';
  const whats = cfg.whatsapp ? cfg.whatsapp.replace(/\D/g, '') : '';
  const instagram = cfg.instagram || '';
  const cidade = cfg.cidade || '';
  const bairro = cfg.bairro || '';
  const localStr = [bairro, cidade].filter(Boolean).join(', ');
  const abordagem = cfg.abordagem || '';
  const sobreMim = cfg.sobre_mim || '';
  const modalidade = cfg.modalidade || 'ambos';
  const valPres = cfg.valor_presencial ? `R$${cfg.valor_presencial}` : '';
  const valOnline = cfg.valor_online ? `R$${cfg.valor_online}` : '';
  const duracao = cfg.duracao_sessao || 50;
  const fotoUrl = cfg.foto_url || '';

  let especialidades = [];
  try { especialidades = JSON.parse(cfg.especialidades || '[]'); } catch(e) {}

  // Iniciais para avatar
  const iniciais = nome.split(' ').map(n => n[0]).slice(0,2).join('').toUpperCase();

  // Montar a foto
  const fotoHTML = fotoUrl
    ? `<div class="hero-foto"><img src="${fotoUrl}" alt="${nome}"></div>`
    : `<div class="hero-foto" style="font-size:48px;font-weight:500;color:rgba(255,255,255,0.8)">${iniciais}</div>`;

  // Tags hero (especialidades ou abordagem)
  const tagsHero = especialidades.slice(0,3).map(e => `<span class="hero-tag">${e}</span>`).join('');

  // Info strip
  const infos = [];
  if (localStr) infos.push(`<div class="info-item"><i class="ti ti-map-pin"></i><span>${localStr}</span></div>`);
  if (duracao) infos.push(`<div class="info-item"><i class="ti ti-clock"></i><span><strong>${duracao}min</strong> por sessão</span></div>`);
  if (valPres && modalidade !== 'online') infos.push(`<div class="info-item"><i class="ti ti-currency-dollar"></i><span>Presencial: <strong>${valPres}</strong></span></div>`);
  if (valOnline && modalidade !== 'presencial') infos.push(`<div class="info-item"><i class="ti ti-video"></i><span>Online: <strong>${valOnline}</strong></span></div>`);
  if (crp) infos.push(`<div class="info-item"><i class="ti ti-id-badge"></i><span>${crp}</span></div>`);

  // Seção sobre mim
  const sobreSection = sobreMim ? `
    <div class="section">
      <div class="section-label">Sobre mim</div>
      <div class="section-text">${sobreMim.replace(/\n/g, '<br>')}</div>
    </div>` : '';

  // Seção abordagem
  const abordagemSection = abordagem ? `
    <div class="section">
      <div class="section-label">A abordagem</div>
      <div class="abordagem-card">
        <p>${abordagem.replace(/\n/g, '<br>')}</p>
      </div>
    </div>` : '';

  // Seção especialidades
  const espSection = especialidades.length > 0 ? `
    <div class="section">
      <div class="section-label">O que trabalhamos</div>
      <div class="section-title">Áreas de atuação</div>
      <div class="esp-grid">
        ${especialidades.map(e => `
          <div class="esp-item">
            <i class="ti ti-${ESPECIALIDADES_ICONS[e] || 'heart'}" aria-hidden="true"></i>
            ${e}
          </div>`).join('')}
      </div>
    </div>` : '';

  // Seção modalidades
  const modCards = [];
  if (modalidade === 'presencial' || modalidade === 'ambos') {
    modCards.push(`
      <div class="modal-card destaque">
        <div class="modal-icon"><i class="ti ti-building"></i></div>
        <div class="modal-title">Presencial</div>
        <div class="modal-sub">${localStr || 'Consulte disponibilidade'}${valPres ? ` · ${valPres}` : ''}</div>
      </div>`);
  }
  if (modalidade === 'online' || modalidade === 'ambos') {
    modCards.push(`
      <div class="modal-card destaque">
        <div class="modal-icon"><i class="ti ti-video"></i></div>
        <div class="modal-title">Online</div>
        <div class="modal-sub">Brasil e exterior${valOnline ? ` · ${valOnline}` : ''}</div>
      </div>`);
  }

  const modSection = modCards.length > 0 ? `
    <div class="section">
      <div class="section-label">Atendimento</div>
      <div class="section-title">Formatos disponíveis</div>
      <div class="modal-grid">${modCards.join('')}</div>
    </div>` : '';

  // Botões sociais
  const btnsHero = [];
  btnsHero.push(`<a href="/agendar/${getSlug()}" class="btn-agendar"><i class="ti ti-calendar"></i> Agendar sessão</a>`);
  if (whats) btnsHero.push(`<a href="https://wa.me/55${whats}" target="_blank" class="btn-wpp"><i class="ti ti-brand-whatsapp"></i> WhatsApp</a>`);

  const document_title = `${nome} | Psicólogo(a)${cidade ? ` em ${cidade}` : ''}`;

  document.title = document_title;
  // Atualizar links de agendamento
  setTimeout(() => {
    const slug = getSlug();
    document.querySelectorAll('[id$="-agendar-btn"]').forEach(el => {
      el.href = '/agendar/' + slug;
    });
  }, 100);

  document.getElementById('root').innerHTML = `
    <!-- HERO -->
    <div class="hero">
      <div class="hero-inner">
        ${fotoHTML}
        <div class="hero-info">
          <div class="hero-badge"><i class="ti ti-shield-check" style="font-size:12px"></i> Profissional verificado</div>
          <h1 class="hero-nome">${nome}</h1>
          <div class="hero-crp">${crp}${crp && abordagem ? ' · ' : ''}${abordagem ? abordagem.split(/[,\n]/)[0].trim() : ''}</div>
          <div class="hero-tags">${tagsHero}</div>
          <div class="hero-btns">${btnsHero.join('')}</div>
        </div>
      </div>
    </div>

    <!-- INFO STRIP -->
    ${infos.length > 0 ? `<div class="info-strip"><div class="info-strip-inner">${infos.join('')}</div></div>` : ''}

    <!-- CONTEÚDO -->
    <div class="content">
      ${sobreSection}
      ${abordagemSection}
      ${espSection}
      ${modSection}


    <!-- CTA FINAL -->
    <div class="content" style="padding-top:0;">
      <div class="cta-box">
        <h2>Pronto para começar?</h2>
        <p>O primeiro passo é o mais importante. Estou aqui para te acompanhar.</p>
        <div class="cta-btns">
          <a id="cta-agendar-btn" href="#" class="btn-agendar"><i class="ti ti-calendar"></i> Agendar sessão</a>
        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
      ${instagram ? `<a href="https://instagram.com/${instagram.replace('@','')}" target="_blank"><i class="ti ti-brand-instagram"></i> ${instagram}</a> · ` : ''}
      <a href="https://www.lumapsi.com.br">Powered by LumaPsi</a>
      <p>${nome}${crp ? ` · ${crp}` : ''}</p>
    </div>
  `;
}

async function enviarSolicitacao(userId, psiNome, psiWhats) {
  const nome = document.getElementById('ag-nome').value.trim();
  const tel = document.getElementById('ag-tel').value.trim();
  const horario = document.getElementById('ag-horario').value;
  const tipo = document.getElementById('ag-tipo').value;
  const msg = document.getElementById('ag-msg').value.trim();

  if (!nome || !tel) { toast('Preencha nome e telefone', 'err'); return; }

  const btn = document.getElementById('btn-agendar');
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader" style="animation:spin .8s linear infinite;display:inline-block"></i> Enviando...';

  const { error } = await sb.from('agendamentos_solicitados').insert([{
    user_id: userId,
    nome,
    telefone: tel,
    queixa: msg || `Preferência: ${horario || 'Sem preferência'} · ${tipo || 'Presencial'}`,
    data_hora: new Date().toISOString(),
    status: 'Pendente',
    tipo: tipo || 'Presencial',
  }]);

  if (error) {
    toast('Erro ao enviar. Tente pelo WhatsApp.', 'err');
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-calendar-check"></i> Solicitar agendamento';
    return;
  }

  // Mostrar mensagem de sucesso
  document.getElementById('agendar').innerHTML = `
    <div style="text-align:center;padding:40px 0;">
      <div style="width:64px;height:64px;border-radius:50%;background:var(--verde-cl);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
        <i class="ti ti-check" style="font-size:28px;color:var(--verde)"></i>
      </div>
      <h3 style="font-family:'Playfair Display',serif;font-size:22px;margin-bottom:8px;">Solicitação enviada!</h3>
      <p style="color:var(--cinza);font-size:14px;line-height:1.6;">
        Sua solicitação foi recebida com sucesso.<br>
        ${psiNome} entrará em contato em breve.
      </p>
      ${psiWhats ? `
        <a href="https://wa.me/55${psiWhats}?text=Olá! Acabei de solicitar um agendamento pelo site." target="_blank"
           style="display:inline-flex;align-items:center;gap:8px;margin-top:20px;background:#25D366;color:#fff;padding:12px 24px;border-radius:50px;text-decoration:none;font-size:14px;">
          <i class="ti ti-brand-whatsapp"></i> Chamar no WhatsApp também
        </a>` : ''}
    </div>`;

  toast('Solicitação enviada com sucesso!', 'ok');
}

function mostrarNotFound(msg) {
  document.getElementById('root').innerHTML = `
    <div class="not-found">
      <div style="font-size:64px;margin-bottom:16px">🔍</div>
      <h1>Perfil não encontrado</h1>
      <p>${msg}</p>
      <a href="https://www.lumapsi.com.br" style="color:var(--roxo);text-decoration:none;font-size:14px;">
        ← Voltar para o LumaPsi
      </a>
    </div>`;
}

carregarPerfil();
</script>
